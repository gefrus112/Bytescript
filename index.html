<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bytescript</title>
<!--
  GitHub Pages fallback entry point.

  If Pages is configured as "Deploy from a branch" (main / root), GitHub
  serves THIS file at https://gefrus112.github.io/Bytescript/ and it forwards
  visitors to the real site in website/. If Pages is configured as
  "GitHub Actions", only website/ is deployed and this file is unused.
  Either way the site loads instead of a 404 / the README.
-->
<meta http-equiv="refresh" content="0; url=website/">
<link rel="canonical" href="website/">
<script>window.location.replace("website/" + window.location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#eef2ff;
    background:radial-gradient(800px 420px at 20% 0%,rgba(139,92,246,.35),transparent),radial-gradient(760px 420px at 85% 100%,rgba(34,211,238,.25),transparent),#070812}
  .card{padding:42px}.spin{width:58px;height:58px;margin:0 auto 18px;border-radius:50%;
    border:4px solid rgba(255,255,255,.18);border-top-color:#fb923c;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}a{color:#22d3ee;font-weight:700}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
  <div class="card">
    <div class="spin" aria-hidden="true"></div>
    <h1>Loading Bytescript…</h1>
    <p>Taking you to the website. If nothing happens, <a href="website/">open it here</a>.</p>
  </div>
</body>
</html>
